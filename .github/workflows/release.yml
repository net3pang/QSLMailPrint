name: Build desktop releases

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            goos: darwin
            goarch: arm64
            electron_args: --mac --arm64
          - name: macOS x64
            os: macos-14
            goos: darwin
            goarch: amd64
            electron_args: --mac --x64
          - name: Windows x64
            os: windows-latest
            goos: windows
            goarch: amd64
            electron_args: --win --x64
          - name: Linux x64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            electron_args: --linux --x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies
        run: npm ci

      - name: Build Go backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: npm run build:backend

      - name: Build Electron package
        run: npx electron-builder ${{ matrix.electron_args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qsl-mail-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  build-lite:
    name: Build Wails lite ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            platform: darwin/arm64
            artifact_suffix: macos-arm64
          - name: macOS x64
            os: macos-14
            platform: darwin/amd64
            artifact_suffix: macos-x64
          - name: Windows x64
            os: windows-latest
            platform: windows/amd64
            artifact_suffix: windows-x64
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux/amd64
            artifact_suffix: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build Wails lite app
        run: npm run wails:build -- --platform ${{ matrix.platform }}

      - name: Package Wails Lite macOS app
        if: runner.os == 'macOS'
        run: |
          app_path="$(find wails/build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "wails/build/bin/QSL-Mail-Lite-${{ matrix.artifact_suffix }}.zip"
          rm -rf "$app_path"

      - name: Rename Wails Lite binary
        if: runner.os != 'macOS'
        shell: bash
        run: mv "wails/build/bin/wails${{ runner.os == 'Windows' && '.exe' || '' }}" "wails/build/bin/QSL-Mail-Lite-${{ matrix.artifact_suffix }}${{ runner.os == 'Windows' && '.exe' || '' }}"

      - name: Upload Wails lite artifact
        uses: actions/upload-artifact@v4
        with:
          name: qsl-mail-lite-${{ matrix.name }}
          path: wails/build/bin/QSL-Mail-Lite-*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-lite]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: qsl-mail-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
